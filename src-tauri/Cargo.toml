[package]
name = "signalpost"
version = "0.1.0"
description = "Approval inbox for parallel Claude Code sessions"
authors = ["Taka-S-dev"]
edition = "2021"
# Two binaries means `cargo run` has to be told which one the app is.
default-run = "signalpost"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "signalpost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "signalpost"
path = "src/main.rs"

# The Codex `notify` shim. Separate so it starts in milliseconds and never
# pulls in the GUI.
[[bin]]
name = "signalpost-codex"
path = "src/bin/codex_notify.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
toml_edit = "0.25.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

