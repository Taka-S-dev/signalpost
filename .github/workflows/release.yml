name: Release

# Tag a version and this attaches the installer to a GitHub release, so the
# app can be tried without a Rust and Node toolchain.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the manifest would publish an installer
      # labelled as a version it does not contain, and the file name inside
      # comes from the manifest either way.
      - name: Check the tag matches the version in the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $manifest = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $manifest) {
            throw "tag $tag does not match tauri.conf.json $manifest"
          }
          "tag and manifest agree on $manifest"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the installer
        run: npm run tauri build

      # Built without the Tauri CLI, the app points its webview at the dev
      # server instead of carrying the pages itself. It compiles, it starts,
      # and it shows a connection error where the panel should be — so the
      # only way to tell the two apart is to look for the page's script
      # inside the executable.
      - name: Check the app carries its frontend
        shell: pwsh
        run: |
          $asset = ([regex]'assets/([A-Za-z0-9._-]+\.js)').Match((Get-Content dist/index.html -Raw)).Groups[1].Value
          if (-not $asset) { throw "no script tag in dist/index.html to look for" }
          # Resolved to a full path: .NET reads relative paths from the
          # process directory, which is not the one Set-Location moved to, and
          # a read of the wrong path here would report a pass.
          $exe = (Resolve-Path "src-tauri/target/release/signalpost.exe").Path
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if (-not $text.Contains($asset)) {
            throw "$exe does not carry $asset; it would open the dev server instead of the panel"
          }
          "$exe carries $asset"

      # Both binaries, because the app looks for the Codex shim beside itself,
      # and the marker, because that is what makes the copy portable.
      - name: Assemble the portable build
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = "portable/Signalpost"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($exe in @('signalpost.exe', 'signalpost-codex.exe')) {
            $from = "src-tauri/target/release/$exe"
            if (-not (Test-Path $from)) { throw "missing $from" }
            Copy-Item $from $stage
          }
          Set-Content "$stage/portable.txt" @(
            'Signalpost, portable build.'
            ''
            'Settings, auto-allow rules and the webview cache all live in the'
            'data folder beside this file. Delete the folder and nothing is'
            'left behind.'
            ''
            'Removing this file turns that off: the app then stores its state'
            'in %APPDATA%\Signalpost, the way the installed build does.'
            ''
            'Keep signalpost-codex.exe next to signalpost.exe. Wiring up Codex'
            'points at it by name from its own folder.'
          )
          Compress-Archive -Path $stage -DestinationPath "Signalpost_${version}_x64-portable.zip" -Force

      # Named rather than globbed: an empty glob would publish a release with
      # nothing attached and still report success.
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/Signalpost_${version}_x64-setup.exe"
          $portable = "Signalpost_${version}_x64-portable.zip"
          foreach ($f in @($installer, $portable)) {
            if (-not (Test-Path $f)) { throw "nothing to publish at $f" }
          }
          # Joined from an array rather than written as a here-string: the
          # terminator of one has to sit at column zero, which cannot happen
          # inside an indented YAML block, and the file stops parsing.
          $notes = @(
            'Windows x64. Two ways to get it:'
            ''
            '- **setup.exe** installs it and stores settings in %APPDATA%\Signalpost.'
            '- **portable.zip** runs from anywhere and keeps everything in a data'
            '  folder beside the executable, including the webview cache. Delete'
            '  the folder and nothing is left behind.'
            ''
            'Neither build is signed, so SmartScreen shows "Windows protected your'
            'PC" on first run: More info, then Run anyway.'
            ''
            'Install the hooks from the setup screen afterwards, and restart any'
            'Claude Code session that is already open.'
          ) -join "`n"
          gh release create "${{ github.ref_name }}" $installer $portable --title "${{ github.ref_name }}" --notes $notes
